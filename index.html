<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desolate Games</title>
<meta name="description" content="Desolate Games is an independent game studio.">
<meta property="og:title" content="Desolate Games">
<meta property="og:description" content="Desolate Games is an independent game studio.">
<meta property="og:image" content="https://desolate.games/logo.webp">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--fg:#fff;--accent:#ff6a00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:1.25rem;background:var(--bg);color:var(--fg);text-align:center}
img{display:block;width:min(100%,60rem);height:auto}
p{margin:0;max-width:32rem;font:400 clamp(1.1rem,2.5vw,1.4rem)/1.5 "Cal Sans",system-ui,sans-serif}
p::before{content:"";display:block;width:3rem;height:2px;margin:0 auto 1.25rem;background:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h1 class="sr">Desolate Games</h1>
<img src="logo.webp" width="2000" height="1121" alt="Desolate Games logo: a bare tree on open ground">
<p>Desolate Games is an independent game studio.</p>
</body>
</html>
